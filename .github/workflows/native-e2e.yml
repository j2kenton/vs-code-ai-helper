name: Native E2E (Maestro)

# Native lanes are expensive, so they are gated to pushes on main and release
# tags rather than every PR. The Linux CI lane (ci.yml) runs on every PR.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  android:
    name: Android emulator + Maestro
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    env:
      # First run on a hosted runner died as
      # `AndroidDriverTimeoutException: Maestro Android driver did not start up
      # in time on emulator [emulator-5554] (driver port 37173)` after ~130s.
      # The app never launched and no flow ran: this is Maestro's own
      # instrumentation driver losing a race with a cold, software-rendered
      # emulator, not a product failure. Hosted runners are far slower at this
      # than any developer machine, so the timeout is raised well past the
      # observed failure rather than nudged just above it.
      MAESTRO_DRIVER_STARTUP_TIMEOUT: '300000'
      MAESTRO_CLI_NO_ANALYTICS: '1'
    steps:
      - uses: actions/checkout@v4

      # pnpm version comes from the root package.json "packageManager" pin.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile
        working-directory: .

      - name: Expo prebuild (android)
        run: pnpm exec expo prebuild --platform android --no-install

      - name: Build debug APK
        run: ./gradlew assembleDebug
        working-directory: apps/mobile/android

      - name: Install Maestro
        run: curl -fsSL https://get.maestro.mobile.dev | bash && echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Run Maestro flows on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          working-directory: apps/mobile
          # Headless, no boot animation, no audio/camera, and no snapshot
          # save/restore — every one of these is time the driver spends waiting
          # on a device that is still doing something else.
          emulator-options: -no-window -no-snapshot -no-boot-anim -noaudio -no-camera -gpu swiftshader_indirect
          disable-animations: true
          script: |
            adb install android/app/build/outputs/apk/debug/app-debug.apk
            # `adb install` returning is not the same as the device being ready
            # to host an instrumentation driver; wait for boot to actually
            # complete before handing over to Maestro.
            adb wait-for-device shell 'while [ "$(getprop sys.boot_completed)" != "1" ]; do sleep 1; done'
            # One retry: driver startup is a race, and a race that fails is
            # worth re-running before it is called a red build. A second
            # failure still fails the job.
            maestro test .maestro/ || maestro test .maestro/

  ios:
    name: iOS simulator + Maestro
    runs-on: macos-latest
    defaults:
      run:
        working-directory: apps/mobile
    env:
      # Same failure as the Android lane, and Maestro named the remedy itself:
      # `IOSDriverTimeoutException: iOS driver not ready in time, consider
      # increasing timeout by configuring MAESTRO_DRIVER_STARTUP_TIMEOUT`.
      # The XCTest driver is installed and launched on the simulator at session
      # start, which a cold CI simulator does not finish quickly.
      MAESTRO_DRIVER_STARTUP_TIMEOUT: '300000'
      MAESTRO_CLI_NO_ANALYTICS: '1'
    steps:
      - uses: actions/checkout@v4

      # pnpm version comes from the root package.json "packageManager" pin.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile
        working-directory: .

      - name: Expo prebuild (ios)
        run: pnpm exec expo prebuild --platform ios --no-install

      - name: Install CocoaPods dependencies
        run: pod install
        working-directory: apps/mobile/ios

      - name: Build for simulator
        run: |
          xcodebuild -workspace ios/EnsembleCommandCenter.xcworkspace \
            -scheme EnsembleCommandCenter \
            -configuration Debug \
            -sdk iphonesimulator \
            -derivedDataPath ios/build \
            CODE_SIGNING_ALLOWED=NO build

      - name: Install Maestro
        run: curl -fsSL https://get.maestro.mobile.dev | bash && echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Boot simulator and run Maestro flows
        run: |
          UDID=$(xcrun simctl create maestro-ci "iPhone 15" || xcrun simctl list devices available | grep -m1 'iPhone' | grep -oE '[0-9A-F-]{36}')
          xcrun simctl boot "$UDID"
          # `simctl boot` returns as soon as boot STARTS. Installing and driving
          # a simulator that is still coming up is the same race the Android
          # lane lost; bootstatus blocks until it is genuinely ready.
          xcrun simctl bootstatus "$UDID" -b
          APP_PATH=$(find ios/build/Build/Products/Debug-iphonesimulator -maxdepth 1 -name '*.app' | head -n1)
          xcrun simctl install "$UDID" "$APP_PATH"
          # One retry, same rationale as the Android lane.
          maestro test .maestro/ || maestro test .maestro/
