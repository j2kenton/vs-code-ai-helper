# Part 11: Settings tab signed-out controls that need no network backend.
# Mirrors the non-network cases in tests/web-smoke/tabs.smoke.spec.ts:
# sign-in options, sandbox provider toggle, gate policy toggle, theme selector.
appId: dev.ensemble.commandcenter
---
- launchApp
- tapOn: 'Settings'
- assertVisible: 'Appearance'
- assertVisible: 'GitHub'
- assertVisible: 'Google'
- assertVisible: 'E2B'
- assertVisible: 'Daytona'
- tapOn: 'Daytona'
- assertVisible: 'Daytona'
- tapOn: 'E2B'
# Gate policy is a segmented control, not a toggling button: both options are
# always on screen and tapping selects one. The old 'Approval required' /
# 'Approval optional' labels belonged to a button that relabelled itself, and
# no longer exist anywhere in the UI.
- assertVisible: 'Gate policy'
- assertVisible: 'Required'
- assertVisible: 'Optional'
- tapOn: 'Optional'
- tapOn: 'Required'
- tapOn: 'dark'
- tapOn: 'light'
- tapOn: 'system'
