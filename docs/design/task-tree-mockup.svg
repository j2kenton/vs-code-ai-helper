<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 560" width="100%" height="100%">
  <!-- Sidebar Panel Mockup -->
  <rect width="240" height="560" fill="#252526" rx="5"/>
  <text x="15" y="30" font-family="Segoe UI, sans-serif" font-size="16" font-weight="bold" fill="#cccccc">Task Inventory</text>
  
  <!-- Task 1 (Active) -->
  <rect x="10" y="50" width="220" height="40" fill="#37373d" rx="4"/>
  <circle cx="25" cy="70" r="6" fill="#0e639c"/>
  <text x="40" y="75" font-family="Segoe UI, sans-serif" font-size="12" font-weight="bold" fill="#ffffff">Task 1 (Active)</text>
  
  <!-- Task 2 (Paused) -->
  <rect x="10" y="100" width="220" height="30" fill="#2d2d2d" rx="4" opacity="0.6"/>
  <circle cx="25" cy="115" r="6" fill="#808080"/>
  <text x="40" y="119" font-family="Segoe UI, sans-serif" font-size="12" fill="#888888">Task 2 (Paused)</text>
</svg>
