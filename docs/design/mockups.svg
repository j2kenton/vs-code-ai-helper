<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <rect width="800" height="600" fill="#1e1e1e" rx="10"/>
  <!-- Sidebar Panel Mockup -->
  <rect x="20" y="20" width="240" height="560" fill="#252526" rx="5"/>
  <text x="35" y="50" font-family="Segoe UI, sans-serif" font-size="16" font-weight="bold" fill="#cccccc">Task Inventory</text>
  
  <!-- Task 1 (Active) -->
  <rect x="30" y="70" width="220" height="40" fill="#37373d" rx="4"/>
  <circle cx="45" cy="90" r="6" fill="#0e639c"/>
  <text x="60" y="95" font-family="Segoe UI, sans-serif" font-size="12" font-weight="bold" fill="#ffffff">Task 1 (Active)</text>
  
  <!-- Task 2 (Paused) -->
  <rect x="30" y="120" width="220" height="30" fill="#2d2d2d" rx="4" opacity="0.6"/>
  <circle cx="45" cy="135" r="6" fill="#808080"/>
  <text x="60" y="139" font-family="Segoe UI, sans-serif" font-size="12" fill="#888888">Task 2 (Paused)</text>
  
  <!-- Webview Settings Panel Mockup -->
  <rect x="280" y="20" width="500" height="560" fill="#1f1f1f" rx="5" stroke="#333333" stroke-width="2"/>
  <text x="300" y="60" font-family="Segoe UI, sans-serif" font-size="20" font-weight="bold" fill="#ffffff">Settings &amp; AI Models</text>
  
  <!-- Table Header -->
  <rect x="300" y="90" width="460" height="30" fill="#2d2d2d"/>
  <text x="310" y="110" font-family="Segoe UI, sans-serif" font-size="12" font-weight="bold" fill="#aaaaaa">Stage</text>
  <text x="430" y="110" font-family="Segoe UI, sans-serif" font-size="12" font-weight="bold" fill="#aaaaaa">Primary Model</text>
  <text x="580" y="110" font-family="Segoe UI, sans-serif" font-size="12" font-weight="bold" fill="#aaaaaa">Backup Model</text>
  <text x="700" y="110" font-family="Segoe UI, sans-serif" font-size="12" font-weight="bold" fill="#aaaaaa">Fallback</text>
  
  <!-- Row 1: Description -->
  <rect x="300" y="125" width="460" height="35" fill="#252526" rx="2"/>
  <text x="310" y="147" font-family="Segoe UI, sans-serif" font-size="12" fill="#ffffff">Description</text>
  <rect x="425" y="130" width="140" height="24" fill="#3c3c3c" rx="3"/>
  <text x="435" y="146" font-family="Segoe UI, sans-serif" font-size="11" fill="#ffffff">gemini-2.0-flash</text>
  <rect x="575" y="130" width="115" height="24" fill="#3c3c3c" rx="3"/>
  <text x="585" y="146" font-family="Segoe UI, sans-serif" font-size="11" fill="#ffffff">claude-3-haiku</text>
  <rect x="715" y="134" width="16" height="16" fill="#0e639c" rx="2"/>
  <path d="M 718 142 L 722 146 L 728 138" stroke="#ffffff" stroke-width="2" fill="none"/>
  
  <!-- Row 2: Implementation -->
  <rect x="300" y="165" width="460" height="35" fill="#252526" rx="2"/>
  <text x="310" y="187" font-family="Segoe UI, sans-serif" font-size="12" fill="#ffffff">Implementation</text>
  <rect x="425" y="170" width="140" height="24" fill="#3c3c3c" rx="3"/>
  <text x="435" y="186" font-family="Segoe UI, sans-serif" font-size="11" fill="#ffffff">gemini-3.1-pro-high</text>
  <rect x="575" y="170" width="115" height="24" fill="#3c3c3c" rx="3"/>
  <text x="585" y="186" font-family="Segoe UI, sans-serif" font-size="11" fill="#ffffff">claude-3.5-sonnet</text>
  <rect x="715" y="174" width="16" height="16" fill="#0e639c" rx="2"/>
  <path d="M 718 182 L 722 186 L 728 178" stroke="#ffffff" stroke-width="2" fill="none"/>
</svg>
