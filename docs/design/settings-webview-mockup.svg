<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 560" width="100%" height="100%">
  <!-- Webview Settings Panel Mockup -->
  <rect width="500" height="560" fill="#1f1f1f" rx="5" stroke="#333333" stroke-width="2"/>
  <text x="20" y="40" font-family="Segoe UI, sans-serif" font-size="20" font-weight="bold" fill="#ffffff">Settings &amp; AI Models</text>
  
  <!-- Table Header -->
  <rect x="20" y="70" width="460" height="30" fill="#2d2d2d"/>
  <text x="30" y="90" font-family="Segoe UI, sans-serif" font-size="12" font-weight="bold" fill="#aaaaaa">Stage</text>
  <text x="150" y="90" font-family="Segoe UI, sans-serif" font-size="12" font-weight="bold" fill="#aaaaaa">Primary Model</text>
  <text x="300" y="90" font-family="Segoe UI, sans-serif" font-size="12" font-weight="bold" fill="#aaaaaa">Backup Model</text>
  <text x="420" y="90" font-family="Segoe UI, sans-serif" font-size="12" font-weight="bold" fill="#aaaaaa">Fallback</text>
  
  <!-- Row 1: Description -->
  <rect x="20" y="105" width="460" height="35" fill="#252526" rx="2"/>
  <text x="30" y="127" font-family="Segoe UI, sans-serif" font-size="12" fill="#ffffff">Description</text>
  <rect x="145" y="110" width="140" height="24" fill="#3c3c3c" rx="3"/>
  <text x="155" y="126" font-family="Segoe UI, sans-serif" font-size="11" fill="#ffffff">gemini-2.0-flash</text>
  <rect x="295" y="110" width="115" height="24" fill="#3c3c3c" rx="3"/>
  <text x="305" y="126" font-family="Segoe UI, sans-serif" font-size="11" fill="#ffffff">claude-3-haiku</text>
  <rect x="435" y="114" width="16" height="16" fill="#0e639c" rx="2"/>
  <path d="M 438 122 L 442 126 L 448 118" stroke="#ffffff" stroke-width="2" fill="none"/>
  
  <!-- Row 2: Implementation -->
  <rect x="20" y="145" width="460" height="35" fill="#252526" rx="2"/>
  <text x="30" y="167" font-family="Segoe UI, sans-serif" font-size="12" fill="#ffffff">Implementation</text>
  <rect x="145" y="150" width="140" height="24" fill="#3c3c3c" rx="3"/>
  <text x="155" y="166" font-family="Segoe UI, sans-serif" font-size="11" fill="#ffffff">gemini-3.1-pro-high</text>
  <rect x="295" y="150" width="115" height="24" fill="#3c3c3c" rx="3"/>
  <text x="305" y="166" font-family="Segoe UI, sans-serif" font-size="11" fill="#ffffff">claude-3.5-sonnet</text>
  <rect x="435" y="154" width="16" height="16" fill="#0e639c" rx="2"/>
  <path d="M 438 162 L 442 166 L 448 158" stroke="#ffffff" stroke-width="2" fill="none"/>
</svg>
